[project]
name = "zeffy-workplace-server"
version = "0.1.0"
description = "Zeffy-Workplace 后端：多 Agent 协作工作台（P1-1 基建升级：alembic + LangGraph + TaskRunner）"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "aiosqlite>=0.20.0",
    "langgraph>=1.2.11",
    "alembic>=1.20.0",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "arq>=0.26.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "aiohttp>=3.10.0",
    "websockets>=13.0",
    "ruff>=0.7.0",
    "mypy>=1.11.0",
    "fakeredis[lua]>=2.23.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "ASYNC"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
